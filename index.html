<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>일정 캘린더</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F6F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style id="app-css">
:root {
  /* Layout: a planner page drawn from the owner's sketch. Date | clock, NEXT EVENT, a week strip, then a 30-minute grid (8:00-25:00) beside 오늘/이번주/이번달 할 일. Month calendar, school timetable and lists follow. Red pen marks Sundays, holidays, today and now. */
  --paper: #F5F6F1;
  --sheet: #FFFFFF;
  --ink: #1A2131;
  --muted: #5C6575;
  --rule: #D2D7DF;
  --pen: #D1372A;
  --sat: #2756C5;
  --grid-line: rgba(48, 92, 156, 0.075);
  --grid-half: rgba(26, 33, 49, 0.07);
  --veil: rgba(26, 33, 49, 0.045);
  --backdrop: rgba(17, 22, 33, 0.42);
  --shadow: 0 1px 0 rgba(26, 33, 49, 0.06), 0 16px 32px -22px rgba(26, 33, 49, 0.5);
  --hl-yellow-bg: #FFE86B; --hl-yellow-ink: #3A3000; --hl-yellow-mark: #E3B300;
  --hl-pink-bg: #FFC6DC; --hl-pink-ink: #5A1235; --hl-pink-mark: #E94B92;
  --hl-green-bg: #BBEEC6; --hl-green-ink: #0E3B1D; --hl-green-mark: #23A44C;
  --hl-sky-bg: #BEE4FF; --hl-sky-ink: #0B3552; --hl-sky-mark: #2390DC;
  --hl-violet-bg: #E0D5FF; --hl-violet-ink: #2C1B63; --hl-violet-mark: #7253DE;
  --hl-orange-bg: #FFD4AA; --hl-orange-ink: #4D2700; --hl-orange-mark: #E8801C;
  --hl-red-bg: #FFC5BC; --hl-red-ink: #5C150C; --hl-red-mark: #E5483A;
  --hl-mint-bg: #B4F0E4; --hl-mint-ink: #0B3F36; --hl-mint-mark: #1FB39A;
  --hl-blue-bg: #CBD5FF; --hl-blue-ink: #172A6B; --hl-blue-mark: #4A63E0;
  --hl-lime-bg: #DDF59A; --hl-lime-ink: #2E3F05; --hl-lime-mark: #8DBF14;
  --hl-brown-bg: #E9D7C3; --hl-brown-ink: #45291A; --hl-brown-mark: #A2714B;
  --hl-gray-bg: #DCE0E6; --hl-gray-ink: #2A303A; --hl-gray-mark: #7C8594;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-pen: "Nanum Pen Script", "Apple SD Gothic Neo", "Malgun Gothic", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141C;
    --sheet: #181E29;
    --ink: #E7EAF0;
    --muted: #9AA3B3;
    --rule: #2C3444;
    --pen: #FF7164;
    --sat: #88A9FF;
    --grid-line: rgba(140, 170, 225, 0.06);
    --grid-half: rgba(231, 234, 240, 0.06);
    --veil: rgba(231, 234, 240, 0.05);
    --backdrop: rgba(0, 0, 0, 0.6);
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.5), 0 18px 36px -20px rgba(0, 0, 0, 0.8);
    --hl-yellow-bg: rgba(255, 214, 51, 0.22); --hl-yellow-ink: #FFE992; --hl-yellow-mark: #FFD633;
    --hl-pink-bg: rgba(255, 106, 170, 0.22); --hl-pink-ink: #FFC4DE; --hl-pink-mark: #FF6BAA;
    --hl-green-bg: rgba(72, 210, 122, 0.2); --hl-green-ink: #B6F2C8; --hl-green-mark: #4CD27B;
    --hl-sky-bg: rgba(82, 170, 255, 0.22); --hl-sky-ink: #C2E4FF; --hl-sky-mark: #55ABFF;
    --hl-violet-bg: rgba(152, 124, 255, 0.24); --hl-violet-ink: #DBCFFF; --hl-violet-mark: #9E85FF;
    --hl-orange-bg: rgba(255, 152, 62, 0.22); --hl-orange-ink: #FFD5AC; --hl-orange-mark: #FF9C40;
    --hl-red-bg: rgba(255, 110, 90, 0.22); --hl-red-ink: #FFC8BF; --hl-red-mark: #FF7A66;
    --hl-mint-bg: rgba(60, 220, 190, 0.2); --hl-mint-ink: #B5F5E8; --hl-mint-mark: #45DCC0;
    --hl-blue-bg: rgba(110, 135, 255, 0.24); --hl-blue-ink: #CDD5FF; --hl-blue-mark: #7F95FF;
    --hl-lime-bg: rgba(170, 230, 60, 0.2); --hl-lime-ink: #E2F7AE; --hl-lime-mark: #B4E64A;
    --hl-brown-bg: rgba(200, 150, 105, 0.22); --hl-brown-ink: #EED9C6; --hl-brown-mark: #C9986C;
    --hl-gray-bg: rgba(160, 170, 185, 0.2); --hl-gray-ink: #DCE1E8; --hl-gray-mark: #A3ACBA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141C;
  --sheet: #181E29;
  --ink: #E7EAF0;
  --muted: #9AA3B3;
  --rule: #2C3444;
  --pen: #FF7164;
  --sat: #88A9FF;
  --grid-line: rgba(140, 170, 225, 0.06);
  --grid-half: rgba(231, 234, 240, 0.06);
  --veil: rgba(231, 234, 240, 0.05);
  --backdrop: rgba(0, 0, 0, 0.6);
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.5), 0 18px 36px -20px rgba(0, 0, 0, 0.8);
  --hl-yellow-bg: rgba(255, 214, 51, 0.22); --hl-yellow-ink: #FFE992; --hl-yellow-mark: #FFD633;
  --hl-pink-bg: rgba(255, 106, 170, 0.22); --hl-pink-ink: #FFC4DE; --hl-pink-mark: #FF6BAA;
  --hl-green-bg: rgba(72, 210, 122, 0.2); --hl-green-ink: #B6F2C8; --hl-green-mark: #4CD27B;
  --hl-sky-bg: rgba(82, 170, 255, 0.22); --hl-sky-ink: #C2E4FF; --hl-sky-mark: #55ABFF;
  --hl-violet-bg: rgba(152, 124, 255, 0.24); --hl-violet-ink: #DBCFFF; --hl-violet-mark: #9E85FF;
  --hl-orange-bg: rgba(255, 152, 62, 0.22); --hl-orange-ink: #FFD5AC; --hl-orange-mark: #FF9C40;
  --hl-red-bg: rgba(255, 110, 90, 0.22); --hl-red-ink: #FFC8BF; --hl-red-mark: #FF7A66;
  --hl-mint-bg: rgba(60, 220, 190, 0.2); --hl-mint-ink: #B5F5E8; --hl-mint-mark: #45DCC0;
  --hl-blue-bg: rgba(110, 135, 255, 0.24); --hl-blue-ink: #CDD5FF; --hl-blue-mark: #7F95FF;
  --hl-lime-bg: rgba(170, 230, 60, 0.2); --hl-lime-ink: #E2F7AE; --hl-lime-mark: #B4E64A;
  --hl-brown-bg: rgba(200, 150, 105, 0.22); --hl-brown-ink: #EED9C6; --hl-brown-mark: #C9986C;
  --hl-gray-bg: rgba(160, 170, 185, 0.2); --hl-gray-ink: #DCE1E8; --hl-gray-mark: #A3ACBA;
  color-scheme: dark;
}

.hl-yellow { --hb: var(--hl-yellow-bg); --hi: var(--hl-yellow-ink); --hm: var(--hl-yellow-mark); }
.hl-pink { --hb: var(--hl-pink-bg); --hi: var(--hl-pink-ink); --hm: var(--hl-pink-mark); }
.hl-green { --hb: var(--hl-green-bg); --hi: var(--hl-green-ink); --hm: var(--hl-green-mark); }
.hl-sky { --hb: var(--hl-sky-bg); --hi: var(--hl-sky-ink); --hm: var(--hl-sky-mark); }
.hl-violet { --hb: var(--hl-violet-bg); --hi: var(--hl-violet-ink); --hm: var(--hl-violet-mark); }
.hl-orange { --hb: var(--hl-orange-bg); --hi: var(--hl-orange-ink); --hm: var(--hl-orange-mark); }
.hl-red { --hb: var(--hl-red-bg); --hi: var(--hl-red-ink); --hm: var(--hl-red-mark); }
.hl-mint { --hb: var(--hl-mint-bg); --hi: var(--hl-mint-ink); --hm: var(--hl-mint-mark); }
.hl-blue { --hb: var(--hl-blue-bg); --hi: var(--hl-blue-ink); --hm: var(--hl-blue-mark); }
.hl-lime { --hb: var(--hl-lime-bg); --hi: var(--hl-lime-ink); --hm: var(--hl-lime-mark); }
.hl-brown { --hb: var(--hl-brown-bg); --hi: var(--hl-brown-ink); --hm: var(--hl-brown-mark); }
.hl-gray { --hb: var(--hl-gray-bg); --hi: var(--hl-gray-ink); --hm: var(--hl-gray-mark); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--sat); outline-offset: 2px; }
[hidden] { display: none !important; }
#app:not([data-mode="edit"]) .edit-only { display: none !important; }
#app:not([data-mode="readonly"]) .ro-only { display: none !important; }
svg { display: block; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); font-size: 14px; font-weight: 600; line-height: 1.2; white-space: nowrap; transition: background-color .15s, border-color .15s, opacity .15s; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .55; }
.btn-primary { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
.btn-primary:hover { border-color: var(--ink); opacity: .88; }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--pen); }
.btn-danger:hover { border-color: var(--pen); }
.btn-sm { min-height: 34px; padding: 0 11px; border-radius: 6px; font-size: 13px; }
.icon-btn { flex: none; display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); }
.icon-btn:hover { border-color: var(--muted); }
.icon-sm { width: 32px; height: 32px; border-color: transparent; background: transparent; color: var(--muted); }
.icon-sm:hover { border-color: var(--rule); color: var(--ink); }

/* page */
.app { max-width: 1180px; margin: 0 auto; padding: 16px 16px 96px; }
.layout { display: flex; flex-direction: column; gap: 28px; }
.col { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; padding: 10px 12px 10px 14px; border: 1.5px solid var(--pen); border-radius: 8px; background: var(--sheet); font-size: 14px; }
.banner p { flex: 1 1 240px; margin: 0; }

/* planner sheet (the sketch) */
.planner { overflow: hidden; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--sheet); box-shadow: var(--shadow); }
.p-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; border-bottom: 1.5px solid var(--ink); }
.p-date { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; padding: 10px 12px; border-right: 1.5px solid var(--ink); }
.p-date-t { font-family: var(--font-display); font-size: clamp(21px, 6vw, 30px); line-height: 1; letter-spacing: .01em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.p-dow { margin-left: 4px; color: var(--muted); font-size: .7em; }
.p-dow.sun { color: var(--pen); }
.p-dow.sat { color: var(--sat); }
.p-today { margin-left: auto; min-height: 30px; padding: 0 9px; font-size: 12.5px; }
.p-clock { display: grid; place-items: center; min-width: 96px; padding: 10px 12px; font-family: var(--font-display); font-size: clamp(21px, 6vw, 30px); line-height: 1; font-variant-numeric: tabular-nums; }
.next { display: grid; grid-template-columns: auto minmax(0, 1fr); border-bottom: 1.5px solid var(--ink); }
.next-lab { display: flex; align-items: center; padding: 0 12px; border-right: 1.5px solid var(--ink); font-size: 12px; font-weight: 700; letter-spacing: .14em; white-space: nowrap; }
.next-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; min-height: 46px; padding: 6px 12px; border: 0; background: transparent; text-align: left; }
.next-btn:hover { background: var(--veil); }
.next-t { min-width: 0; font-size: 15.5px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.next-d { flex: none; color: var(--pen); font-family: var(--font-display); font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.next-none { color: var(--muted); font-size: 13.5px; font-weight: 500; }
.wstrip { display: grid; grid-template-columns: 26px repeat(7, minmax(0, 1fr)) 26px; border-bottom: 1.5px solid var(--ink); background: var(--veil); }
.ws-nav { display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: var(--muted); }
.ws-nav:hover { color: var(--ink); }
.ws-day { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 6px 0; border: 0; background: transparent; }
.ws-day .w { color: var(--muted); font-size: 11px; font-weight: 600; line-height: 1.2; }
.ws-day .n { position: relative; display: grid; place-items: center; min-width: 28px; height: 28px; padding: 0 3px; border-radius: 7px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ws-day.sun .n, .ws-day.hol .n { color: var(--pen); }
.ws-day.sat .n { color: var(--sat); }
.ws-day.sel .n { background: var(--ink); color: var(--sheet); }
.ws-day .dots { display: flex; gap: 2px; height: 5px; }
.ws-day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--hm); }
.ring { position: absolute; left: 50%; top: 50%; width: 42px; height: 34px; overflow: visible; transform: translate(-50%, -50%) rotate(-8deg); pointer-events: none; }
.ring path { fill: none; stroke: var(--pen); stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 220; stroke-dashoffset: 0; }
.ring.draw path { animation: pen-draw 950ms cubic-bezier(.55, .1, .3, 1) 300ms both; }
@keyframes pen-draw { from { stroke-dashoffset: 220; } to { stroke-dashoffset: 0; } }
.ws-day .ring { width: 40px; height: 33px; }

/* day board: 30-minute grid + to-do lists */
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); height: 500px; height: clamp(380px, calc(100dvh - 290px), 640px); }
.tl { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tl-head, .tl-allday, .tl-grid { display: grid; grid-template-columns: 36px minmax(0, 1fr); }
.tl-head { border-bottom: 1px solid var(--rule); }
.tl-head .c0 { border-right: 1px solid var(--rule); }
.tl-add, .tl-lab { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 34px; padding: 0 8px; font-size: 13.5px; font-weight: 700; }
.tl-add { border: 0; background: transparent; }
.tl-add:hover { background: var(--veil); }
.tl-allday { max-height: 92px; overflow-y: auto; border-bottom: 1px solid var(--rule); }
.tl-al-lab { padding-top: 6px; border-right: 1px solid var(--rule); color: var(--muted); font-size: 10.5px; font-weight: 700; text-align: center; }
.tl-al-list { display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 4px; }
.al-chip { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; width: 100%; padding: 3px 6px; border: 0; border-radius: 3px 7px 4px 8px / 6px 4px 7px 5px; background: var(--hb); color: var(--hi); font-size: 12px; font-weight: 700; line-height: 1.3; text-align: left; overflow-wrap: anywhere; }
.al-t { min-width: 0; overflow-wrap: anywhere; }
.al-chip .pe { flex: none; margin-top: 2px; opacity: .65; }
.al-chip small { margin-right: 4px; font-size: 10.5px; font-weight: 600; opacity: .8; }
.tl-scroll { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.tl-times { position: relative; border-right: 1px solid var(--rule); }
.tl-h { position: absolute; left: 0; right: 0; padding-top: 2px; color: var(--muted); font-size: 10px; font-weight: 600; line-height: 1.2; text-align: center; font-variant-numeric: tabular-nums; }
.tl-col { position: relative; background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(var(--grid-half) 1px, transparent 1px); background-size: 100% calc(var(--slot) * 2), 100% var(--slot); }
#app[data-mode="edit"] .tl-col { cursor: pointer; }
.blk { position: absolute; z-index: 1; display: flex; flex-direction: column; gap: 1px; overflow: hidden; padding: 2px 5px; border: 0; border-radius: 3px 7px 4px 8px / 6px 4px 7px 5px; background: var(--hb); color: var(--hi); line-height: 1.2; text-align: left; }
.blk .bt { font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
.blk .bm { font-size: 10.5px; font-weight: 600; opacity: .8; font-variant-numeric: tabular-nums; }
.blk.short { flex-direction: row; align-items: center; gap: 4px; }
.blk.short .bt { flex: 0 0 auto; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.blk.short .bm { flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.blk.cls { border: 1.5px dashed var(--hm); background: var(--sheet); color: var(--ink); }
.blk.cls .bm { color: var(--muted); opacity: 1; }
.blk.cls.empty { border: 1px solid var(--rule); background: var(--veil); color: var(--muted); }
.blk.brk { z-index: 0; border: 0; background: repeating-linear-gradient(135deg, transparent 0 5px, var(--veil) 5px 7px); color: var(--muted); pointer-events: none; }
.blk .pe { position: absolute; right: 4px; bottom: 3px; opacity: .65; }
.blk .rp { position: absolute; top: 3px; right: 3px; opacity: .7; }
.now-line { position: absolute; left: -5px; right: 0; z-index: 3; height: 0; border-top: 2px solid var(--pen); pointer-events: none; }
.now-line::before { content: ""; position: absolute; left: -2px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--pen); }
.tl-hint { position: absolute; left: 6px; right: 6px; top: calc(var(--slot) * 2 + 6px); color: var(--muted); font-family: var(--font-pen); font-size: 21px; line-height: 1.15; text-align: center; pointer-events: none; }
.todos { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-left: 1.5px solid var(--ink); }
.todo { display: flex; flex: 1 1 0; flex-direction: column; min-height: 0; border-bottom: 1px solid var(--rule); }
.todo:last-child { border-bottom: 0; }
.todo-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 2px 6px; margin: 0; padding: 7px 8px 3px; font-size: 13.5px; font-weight: 700; text-align: center; }
.todo-n { color: var(--muted); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.todo-list { flex: 1 1 auto; min-height: 0; margin: 0; padding: 0 8px; overflow-y: auto; list-style: none; }
.todo-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: start; gap: 6px; padding: 5px 0; border-bottom: 1px dashed var(--rule); font-size: 13.5px; line-height: 1.35; }
.tick { display: grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 1.5px solid var(--muted); border-radius: 5px; background: var(--sheet); color: transparent; }
.todo-item.done .tick { border-color: var(--pen); background: var(--pen); color: var(--sheet); }
.todo-t { padding-top: 1px; overflow-wrap: anywhere; }
.todo-item.done .todo-t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 2px; }
.todo-x { display: grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: transparent; color: var(--muted); }
.todo-x:hover { background: var(--veil); color: var(--pen); }
.todo-empty { padding: 4px 0; color: var(--muted); font-size: 12.5px; }
.todo-add { padding: 4px 8px 7px; }
.todo-in { width: 100%; min-height: 34px; padding: 5px 8px; border: 1px dashed var(--rule); border-radius: 6px; background: transparent; font-size: 16px; }
.todo-in:focus { border-style: solid; border-color: var(--ink); outline: none; }

/* month */
.month-bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.month-title { display: flex; flex-direction: column; gap: 2px; margin: 0; font-weight: 400; }
.m-year { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.m-name { font-family: var(--font-display); font-size: 40px; line-height: .95; letter-spacing: -0.01em; }

  function todoKey(sc, s) {

    }

  /* ---------- render: month, timetable, lists ---------- */
  function eventsByDay(a, b) {
    const map = new Map();
    const evs = sorted();
    for (let d = a; d <= b; d += 1) {
      const s = fromDn(d);
      const list = evs.filter((ev) => occurs(ev, s));
      if (list.length) map.set(d, list);
    }
    return map;
  }
  function cellLabel(s, hol, count, isToday) {
    const p = parts(s);
    let t = `${p.m}월 ${p.d}일 ${DOW[dowOf(s)]}요일`;
    if (isToday) t += ', 오늘';
    if (hol) t += `, ${hol}`;
    t += count ? `, 일정 ${count}개` : ', 일정 없음';

  function renderMonth() {
    el.year.textContent = `${view.y}년`;

    const firstDn = dn(first);
    const startDn = firstDn - dowOf(first);
    const lastDn = firstDn + daysIn(view.y, view.m) - 1;
    const weeks = Math.ceil((lastDn - startDn + 1) / 7);
    const endDn = startDn + weeks * 7 - 1;
    const byDay = eventsByDay(startDn, endDn);
    const todayDn = dn(today);
    const selDn = dn(view.sel);
    const frag = document.createDocumentFragment();
    for (let i = 0; i < weeks * 7; i += 1) {
      const d = startDn + i;
      const s = fromDn(d);
      const p = parts(s);
      const wd = i % 7;

      const list = byDay.get(d) || [];
      const b = h('button', 'cell');
      b.type = 'button';
      b.dataset.date = s;
      if (p.m !== view.m) b.classList.add('out');
      if (wd === 0) b.classList.add('sun');
      if (wd === 6) b.classList.add('sat');
      if (hol) b.classList.add('hol');
      if (i >= (weeks - 1) * 7) b.classList.add('last-row');
      b.tabIndex = d === selDn ? 0 : -1;
      b.setAttribute('aria-pressed', d === selDn ? 'true' : 'false');

      frag.appendChild(b);

    el.grid.replaceChildren(frag);

  function nowInfo() {
    const wd = dowOf(today);
    if (wd < 1 || wd > SCHOOL_DAYS || HOLIDAYS[today]) return null;
    const d = wd - 1;
    const t = new Date();
    const m = t.getHours() * 60 + t.getMinutes();
    let cur = -1;
    let next = -1;
    const cnt = dayCount(state.tt, d);
    state.tt.periods.forEach((per, p) => {
      const s = mins(per.s);
      const e = mins(per.e);
      if (p >= cnt || (!state.tt.cells[d][p] && !state.tt.counts) || s < 0) return;
      if (e > s && m >= s && m < e) cur = p;
      else if (s > m && next < 0) next = p;
    });
    return { d, cur, next: cur >= 0 ? -1 : next };
  }

      tr.appendChild(th);

  /* ---------- saving ---------- */
  function setMode(m) {

    renderFrame();
    renderTodos();
  }
  function initCaps() {
    let ok = !dataError;
    if (ok) {
      try { localStorage.setItem('cal-app-test', '1'); localStorage.removeItem('cal-app-test'); } catch (_) { ok = false; }
    }
    if (!ok) { setMode('readonly'); return; }
    api = { publish: async (json) => { localStorage.setItem(STORE_KEY, json); } };
    setMode('edit');
  }
  function failMsg(code) {
    if (code === 'conflict') return '그사이 다른 곳에서 바뀐 내용이 있어 새로 불러와요. 다시 한 번 해 주세요.';
    if (code === 'rate_limited') return '저장이 너무 잦아요. 잠시 뒤에 다시 해 주세요.';
    if (code === 'too_large') return '내용이 너무 많아 저장하지 못했어요. 지난 일정이나 할 일을 조금 지워 주세요.';
    if (code === 'busy') return '앞의 저장이 끝나면 다시 해 주세요.';
    if (READ_ONLY.has(code)) return '보기 전용 화면이라 바꿀 수 없어요.';
    return '저장하지 못했어요. 폰 저장 공간을 확인하고 다시 해 주세요.';
  }
  /* Every save publishes the whole page as a new version; the platform then reloads open views to it. */
  async function commit(next, flash) {
    if (busy) return { ok: false, code: 'busy' };
    if (mode !== 'edit' || !api || dataError) return { ok: false, code: 'not_writer' };
    busy = true;
    let html;
    try { html = JSON.stringify({ v: 3, name: next.name, events: next.events, tt: next.tt, todos: next.todos }); } catch (_) { busy = false; return { ok: false, code: 'build' }; }
    const fl = Object.assign({ at: Date.now() }, flash);
    pendingFlash = fl;
    ssSet(SS_FLASH, fl);
    saveView();
    for (let attempt = 0; ; attempt += 1) {
      try {
        await api.publish(html);
        state = next;
        unsaved = false;
        clearTimeout(saveTimer);
        return { ok: true };
      } catch (err) {
        const code = err && typeof err.code === 'string' ? err.code : 'upstream_error';
        if (code === 'upstream_error' && attempt === 0) { await sleep(600 + Math.random() * 900); continue; }
        busy = false;
        pendingFlash = null;
        ssDel(SS_FLASH);
        if (code === 'conflict') {
          pendingFlash = { kind: 'conflict', at: Date.now() };
          ssSet(SS_FLASH, pendingFlash);
        }
        if (READ_ONLY.has(code)) setMode('readonly');
        return { ok: false, code };
      }
    }
  }
  /* If this view is still here a moment after a successful publish, update it in place. */
  function afterSuccess(done) {
    setTimeout(() => {
      if (done) done();
      busy = false;
      saveChip(null);
      render();
      consumeFlash();
    }, 0);
  }
  /* To-do ticks and additions are batched: one publish after a short pause. */
  function anyDialogOpen() { return [el.formDlg, el.nameDlg, el.ttDlg].some((d) => d.open); }
  function markDirty() {
    if (!unsaved) dirtySince = Date.now();
    unsaved = true;
    saveChip('pending');

      frag.appendChild(h('p', 'hint', `${DOW[d + 1]}요일을 다 넣었으면 위에서 다음 요일을 고르세요. 저장은 마지막에 한 번만 누르면 돼요.`));
    }
    el.ttPanel.replaceChildren(frag);
  }
  function openTT(tab) {
    if (mode !== 'edit' || busy) return;
    ttDraft = JSON.parse(JSON.stringify(state.tt));
    const wd = dowOf(view.sel);
    ttTab = typeof tab === 'number' || tab === 'times' || tab === 'colors' ? tab : wd >= 1 && wd <= SCHOOL_DAYS ? wd - 1 : 0;
    ttDirty = false;
    ttCloseArmed = false;
    ttClearArmed = false;
    el.ttErr.textContent = '';
    el.ttCancel.textContent = '취소';
    el.ttClear.textContent = '전체 비우기';
    ttBusy(false);
    renderTTEditor();
    showDialog(el.ttDlg);
    const first = el.ttPanel.querySelector('input');
    if (first) first.focus();
  }
  function closeTT() {
    if (busy) return;
    if (ttDirty && !ttCloseArmed) {
      ttCloseArmed = true;
      el.ttCancel.textContent = '저장 안 하고 닫기';
      el.ttErr.textContent = '입력한 내용이 아직 저장되지 않았어요.';
      return;
    }
    closeDialog(el.ttDlg);
  }
  async function saveTT() {
    if (busy || !ttDraft) return;
    const tt = sanitizeTT(ttDraft);
    for (let p = 0; p < tt.periods.length; p += 1) {
      const { s, e } = tt.periods[p];
      const prev = p > 0 ? tt.periods[p - 1].e || tt.periods[p - 1].s : '';
      let msg = '';
      if (s && e && mins(e) <= mins(s)) msg = `${p + 1}교시 끝 시간이 시작 시간보다 빨라요.`;
      else if (s && prev && mins(s) < mins(prev)) msg = `${p + 1}교시가 ${p}교시보다 먼저 시작해요. 시간을 확인해 주세요.`;
      if (msg) {
        ttTab = 'times';
        renderTTEditor();
        el.ttErr.textContent = msg;
        const i = $(`tt-ps-${p}`);
        if (i) i.focus();
        return;
      }
    }
    if (ttSig(tt) === ttSig(state.tt)) { closeDialog(el.ttDlg); return; }
    const next = cloneState();
    next.tt = tt;
    ttBusy(true);
    const r = await commit(next, { kind: 'timetable', sig: ttSig(tt) });
    if (r.ok) {
      afterSuccess(() => { ttBusy(false); closeDialog(el.ttDlg); });
      return;
    }
    ttBusy(false);
    el.ttErr.textContent = failMsg(r.code);
  }

  /* ---------- wiring ---------- */
  function wire() {
    el.pToday.addEventListener('click', () => select(today));
    el.nextBtn.addEventListener('click', () => { if (el.nextBtn.dataset.date) select(el.nextBtn.dataset.date); });
    el.wstrip.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.step) select(fromDn(dn(view.sel) + +b.dataset.step));
      else if (b.dataset.date) select(b.dataset.date);
    });
    el.tlAdd.addEventListener('click', () => openForm(null, view.sel));
    el.fab.addEventListener('click', () => openForm(null, view.sel));
    const openFromEvent = (b) => {
      const ev = state.events.find((x) => x.id === b.dataset.id);
      if (!ev) return;
      if (mode === 'edit') openForm(ev, null, b.dataset.occ);
      else showInfo(ev, b.dataset.occ);
    };
    el.tlAlList.addEventListener('click', (e) => {
      const b = e.target.closest('.al-chip');
      if (b) openFromEvent(b);
    });
    el.tlCol.addEventListener('click', (e) => {
      const b = e.target.closest('.blk');
      if (b) {
        if (b.dataset.id) openFromEvent(b);
        else if (b.dataset.cls && mode === 'edit') openTT(+b.dataset.cls);
        return;
      }
      if (mode !== 'edit') return;
      const r = el.tlCol.getBoundingClientRect();
      const slot = Math.max(0, Math.min((T1 - T0) / 30 - 1, Math.floor((e.clientY - r.top) / SLOT)));
      const m = T0 + slot * 30;
      const date = m >= 1440 ? fromDn(dn(view.sel) + 1) : view.sel;
      const start = m >= 1440 ? m - 1440 : m;
      openForm(null, date, null, { time: hhmm(start), endTime: hhmm(Math.min(start + 60, 1439)) });
    });

    el.todos.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b || mode !== 'edit') return;
      const li = b.closest('.todo-item');
      const t = li && state.todos.find((x) => x.id === li.dataset.id);
      if (!t) return;
      if (b.dataset.act === 'tick') {
        t.done = !t.done;
        renderTodos();
        markDirty();
      } else if (b.dataset.act === 'del') {
        const i = state.todos.indexOf(t);
        state.todos.splice(i, 1);
        renderTodos();
        markDirty();
        toast(`‘${short(t.t)}’ 지웠어요.`, { label: '되돌리기', fn: () => { state.todos.splice(Math.min(i, state.todos.length), 0, t); renderTodos(); markDirty(); } });
      }
    });
    el.todos.addEventListener('keydown', (e) => {
      const inp = e.target.closest('.todo-in');
      if (!inp || e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      addTodo(inp.dataset.scope, inp);
    });
    el.todos.addEventListener('focusout', (e) => {
      const inp = e.target.closest && e.target.closest('.todo-in');
      if (inp && inp.value.trim()) addTodo(inp.dataset.scope, inp);
    });
    el.toastA.addEventListener('click', () => {
      const fn = toastFn;
      toastFn = null;
      el.toast.classList.remove('show');
      if (fn) fn();
    });

    el.prev.addEventListener('click', () => shiftMonth(-1));
    el.next.addEventListener('click', () => shiftMonth(1));
    el.todayBtn.addEventListener('click', () => select(today, { reveal: true }));
    let suppress = false;
    el.grid.addEventListener('click', (e) => {
      if (suppress) return;
      const c = e.target.closest('.cell');
      if (c) select(c.dataset.date, { focus: e.detail === 0, reveal: e.detail !== 0 });
    });
    el.grid.addEventListener('keydown', (e) => {
      const c = e.target.closest('.cell');
      if (!c) return;
      const s = c.dataset.date;
      let n = null;
      if (e.key === 'ArrowLeft') n = fromDn(dn(s) - 1);
      else if (e.key === 'ArrowRight') n = fromDn(dn(s) + 1);
      else if (e.key === 'ArrowUp') n = fromDn(dn(s) - 7);
      else if (e.key === 'ArrowDown') n = fromDn(dn(s) + 7);
      else if (e.key === 'Home') n = fromDn(dn(s) - dowOf(s));
      else if (e.key === 'End') n = fromDn(dn(s) + 6 - dowOf(s));
      else if (e.key === 'PageUp') n = addMonths(s, -1);
      else if (e.key === 'PageDown') n = addMonths(s, 1);
      if (!n) return;
      e.preventDefault();
      select(n, { focus: true });
    });
    let sx = 0;
    let sy = 0;
    let tracking = false;
    el.grid.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) { tracking = false; return; }
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });
    el.grid.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;
      if (Math.abs(dx) > 60 && Math.abs(dy) < 45) {
        suppress = true;
        setTimeout(() => { suppress = false; }, 350);
        shiftMonth(dx < 0 ? 1 : -1);
      }
    }, { passive: true });

    el.upList.addEventListener('click', (e) => {
      const ed = e.target.closest('.up-edit');
      if (ed) {
        const ev = state.events.find((x) => x.id === ed.dataset.edit);
        if (ev) openForm(ev);
        return;
      }
      const b = e.target.closest('.up-row');
      if (b) select(b.dataset.date, { reveal: true });
    });
    el.repList.addEventListener('click', (e) => {
      const ed = e.target.closest('.up-edit');
      const b = ed || e.target.closest('.rep-row');
      const ev = b && state.events.find((x) => x.id === (ed ? ed.dataset.edit : b.dataset.id));
      if (!ev) return;
      if (mode === 'edit') openForm(ev);
      else { const n = nextOcc(ev, today); if (n) select(n, { reveal: true }); }
    });
    el.more.addEventListener('click', () => {
      view.all = !view.all;
      saveView();
      renderUpcoming();
    });

    el.renameBtn.addEventListener('click', () => {
      if (mode !== 'edit' || busy) return;
      el.fName.value = state.name;
      el.nErr.textContent = '';
      nameBusy(false);
      showDialog(el.nameDlg);
    });
    el.nameForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) return;
      const v = el.fName.value.trim().slice(0, 30);
      if (!v) { el.nErr.textContent = '이름을 적어 주세요.'; el.fName.focus(); return; }
      if (v === state.name) { closeDialog(el.nameDlg); return; }
      const next = cloneState();
      next.name = v;
      nameBusy(true);
      const r = await commit(next, { kind: 'renamed', name: v });
      if (r.ok) { afterSuccess(() => { nameBusy(false); closeDialog(el.nameDlg); }); return; }
      nameBusy(false);
      el.nErr.textContent = failMsg(r.code);
    });
    el.nCancel.addEventListener('click', () => closeDialog(el.nameDlg));

    el.evForm.addEventListener('submit', (e) => { e.preventDefault(); saveForm(); });
    el.evForm.addEventListener('change', (e) => {
      const n = e.target.name;
      if (n === 'scope') applyScope();
      else if (n === 'rep') setRepUI(true);
      else if (n === 'day' || e.target === f.until) updateRule();
    });
    el.formX.addEventListener('click', () => closeDialog(el.formDlg));
    el.fCancel.addEventListener('click', () => closeDialog(el.formDlg));
    el.fDel.addEventListener('click', () => {
      if (!editingId || busy) return;
      if (!delArmed) { delArmed = true; el.fDel.textContent = '한 번 더 누르면 삭제'; return; }
      const ev = state.events.find((x) => x.id === editingId);
      if (ev) removeEvent(ev);
      else closeDialog(el.formDlg);
    });
    el.fSkip.addEventListener('click', () => {
      if (!editingId || !editingOcc || busy) return;
      if (!skipArmed) { skipArmed = true; el.fSkip.textContent = `한 번 더 누르면 ${md(editingOcc)}만 삭제`; return; }
      const ev = state.events.find((x) => x.id === editingId);
      if (ev) skipOccurrence(ev, editingOcc);
      else closeDialog(el.formDlg);
    });
    f.allday.addEventListener('change', () => {
      el.timeRow.hidden = f.allday.checked;
      if (!f.allday.checked && !f.time.value) f.time.value = '09:00';
    });
    f.start.addEventListener('change', () => {
      f.end.min = f.start.value;
      f.until.min = f.start.value;
      if (f.end.value && f.end.value < f.start.value) f.end.value = '';
      updateRule();
    });
    for (const d of [el.formDlg, el.nameDlg]) {
      d.addEventListener('cancel', (e) => { if (busy) e.preventDefault(); });
      d.addEventListener('click', (e) => { if (e.target === d && !busy) closeDialog(d); });
    }

    el.ttEdit.addEventListener('click', () => openTT());
    el.ttColor.addEventListener('click', () => openTT('colors'));
    el.ttStart.addEventListener('click', () => openTT());
    el.ttPrev.addEventListener('click', () => select(fromDn(dn(view.sel) - 7)));
    el.ttNext.addEventListener('click', () => select(fromDn(dn(view.sel) + 7)));
    el.ttTable.addEventListener('click', (e) => {
      const b = e.target.closest('.tt-dbtn');
      if (b) select(b.dataset.date, { reveal: true });
    });
    el.ttTabs.addEventListener('click', (e) => {
      const b = e.target.closest('.tab');
      if (!b || busy || !ttDraft) return;
      ttTab = b.dataset.tab === 'times' || b.dataset.tab === 'colors' ? b.dataset.tab : +b.dataset.tab;
      el.ttErr.textContent = '';
      renderTTEditor();
    });
    el.ttTabs.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const tabs = [...el.ttTabs.querySelectorAll('.tab')];
      const i = tabs.findIndex((t) => t.getAttribute('aria-selected') === 'true');
      const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      e.preventDefault();
      n.click();
      n.focus();
    });
    el.ttPanel.addEventListener('input', (e) => {
      const t = e.target;
      const k = t.dataset && t.dataset.k;
      if (!k || !ttDraft) return;
      if (k === 'color') {
        if (!t.checked) return;
        if (!ttDraft.colors) ttDraft.colors = {};
        ttDraft.colors[t.dataset.sub] = t.value;
        ttDirty = true;
        ttCloseArmed = false;
        el.ttCancel.textContent = '취소';
        /* redraw after the tap has finished, so the other subjects' automatic colours update without re-firing radios */
        const id = t.id;
        const keep = el.ttDlg.scrollTop;
        setTimeout(() => {
          if (ttTab !== 'colors' || !el.ttDlg.open) return;
          renderTTEditor();
          el.ttDlg.scrollTop = keep;
          const again = $(id);
          if (again) again.focus({ preventScroll: true });
        }, 0);
        return;
      }
      if (k === 'count') {
        if (!ttDraft.counts) ttDraft.counts = Array.from({ length: SCHOOL_DAYS }, () => ttDraft.periods.length);
        ttDraft.counts[+t.dataset.d] = +t.value;
        ttDirty = true;
        ttCloseArmed = false;
        el.ttCancel.textContent = '취소';
        return;
      }
      const p = +t.dataset.p;
      if (k === 's' || k === 'e') ttDraft.periods[p][k] = t.value.slice(0, 5);
      else {
        const d = +t.dataset.d;
        const cell = ttDraft.cells[d][p] || { t: '', r: '' };
        cell[k] = t.value;
        ttDraft.cells[d][p] = cell;
      }
      ttDirty = true;
      ttCloseArmed = false;
      el.ttCancel.textContent = '취소';
      if (el.ttErr.textContent) el.ttErr.textContent = '';
    });
    el.ttPanel.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
      const t = e.target;
      if (t.tagName !== 'INPUT') return;
      e.preventDefault();
      const inputs = [...el.ttPanel.querySelectorAll('input')];
      const i = inputs.indexOf(t);
      if (i >= 0 && i < inputs.length - 1) inputs[i + 1].focus();
      else t.blur();
    });
    el.ttPanel.addEventListener('click', (e) => {
      const b = e.target.closest('[data-action]');
      if (!b || !ttDraft || busy) return;
      const P = ttDraft.periods;
      if (b.dataset.action === 'tt-more' && P.length < MAX_PERIODS) {
        if (ttDraft.counts) ttDraft.counts = ttDraft.counts.map((n) => (n === P.length ? n + 1 : n));
        const s = addMin(P[P.length - 1].e, 10);
        P.push({ s, e: addMin(s, 50) });
        for (const row of ttDraft.cells) row.push(null);
      } else if (b.dataset.action === 'tt-less' && P.length > 1) {
        P.pop();
        for (const row of ttDraft.cells) row.pop();
        if (ttDraft.counts) ttDraft.counts = ttDraft.counts.map((n) => Math.min(n, P.length));
      } else return;
      ttDirty = true;
      renderTTEditor();
    });
    el.ttClear.addEventListener('click', () => {
      if (busy || !ttDraft) return;
      if (!ttClearArmed) { ttClearArmed = true; el.ttClear.textContent = '한 번 더 누르면 다 비워요'; return; }
      ttClearArmed = false;
      el.ttClear.textContent = '전체 비우기';
      ttDraft.cells = blankCells(ttDraft.periods.length);
      ttDirty = true;
      renderTTEditor();
    });
    el.ttForm.addEventListener('submit', (e) => e.preventDefault());
    el.ttSave.addEventListener('click', saveTT);
    el.ttCancel.addEventListener('click', closeTT);
    el.ttX.addEventListener('click', closeTT);
    el.ttDlg.addEventListener('cancel', (e) => { e.preventDefault(); closeTT(); });
    el.ttDlg.addEventListener('click', (e) => { if (e.target === el.ttDlg) closeTT(); });

    el.expBtn.addEventListener('click', () => {
      try {
        const json = JSON.stringify({ v: 3, name: state.name, events: state.events, tt: state.tt, todos: state.todos }, null, 1);
        const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `일정-백업-${today}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        toast('백업 파일을 저장했어요. 내려받기 폴더를 확인해 주세요.');
      } catch (_) { toast('백업 파일을 만들지 못했어요.'); }
    });
    el.impBtn.addEventListener('click', () => { if (mode === 'edit' && !busy) el.impFile.click(); });
    el.impFile.addEventListener('change', async () => {
      const file = el.impFile.files && el.impFile.files[0];
      el.impFile.value = '';
      if (!file) return;
      let raw = null;
      try { raw = JSON.parse(await file.text()); } catch (_) { raw = null; }
      if (!raw || typeof raw !== 'object' || !Array.isArray(raw.events)) { toast('이 캘린더의 백업 파일이 아니에요.'); return; }
      const next = sanitize(raw);
      const apply = async () => {
        const r = await commit(next, { kind: 'imported' });
        if (r.ok) { scrolledFor = ''; afterSuccess(null); } else toast(failMsg(r.code));
      };
      const hasData = state.events.length || state.todos.length || ttHasAny(state.tt);
      if (hasData) toast('지금 내용을 지우고 백업 내용으로 바꿀까요?', { label: '바꾸기', fn: apply });
      else apply();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) flushSave(true);
      else tick();
    });
    window.addEventListener('pagehide', () => flushSave(true));
  }

  /* ---------- boot ---------- */
  const savedView = ssGet(SS_VIEW);
  if (savedView && typeof savedView.at === 'number' && Date.now() - savedView.at < 30 * 60000) restoreView(savedView);
  ringDrawn = !!ssGet(SS_FLASH);
  renderTimes();
  render();
  lastNow = nowKey();
  wire();
  initCaps();
  setInterval(tick, 15000);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* works online without it */ });
  }

  const hot = window.claude && window.claude.hot;
  let hotStarted = false;
  const hotStart = (data) => {
    if (hotStarted) return;
    hotStarted = true;
    const d = data && typeof data === 'object' ? data : {};
    if (d.view) {
      restoreView(d.view);
      scrolledFor = '';
      render();
    }
    if (d.drafts && typeof d.drafts === 'object') {
      for (const sc of SCOPES) if (typeof d.drafts[sc] === 'string') el.todo[sc].input.value = d.drafts[sc].slice(0, 80);
    }
    consumeFlash(d.flash || null);
  };
  if (hot && typeof hot.snapshot === 'function') {
    try {
      hot.snapshot(() => ({
        view: { y: view.y, m: view.m, sel: view.sel, all: view.all, tl: el.tlScroll.scrollTop },
        flash: pendingFlash,
        drafts: { d: el.todo.d.input.value, w: el.todo.w.input.value, m: el.todo.m.input.value },
      }));
    } catch (_) { /* optional */ }
  }
  if (hot && typeof hot.ready === 'function') {
    try { hot.ready(hotStart); } catch (_) { hotStart({}); }
    setTimeout(() => hotStart({}), 1500);
  } else {
    hotStart((hot && hot.data) || {});
  }
})();
</script>
</body>
</html>
